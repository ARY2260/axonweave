name: Deploy Documentation to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs-site/**','docs/**','.github/workflows/docs-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - working-directory: docs-site
        run: npm install
      - name: Typecheck
        working-directory: docs-site
        run: npm run typecheck
      - name: Lint DESIGN.md design tokens
        working-directory: docs-site
        run: npm run design:lint
      - name: Build production site
        working-directory: docs-site
        env:
          VITE_BASE_PATH: /axonweave/
        run: npm run build
      - name: Verify build artifacts
        working-directory: docs-site
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/sitemap.xml
          echo "docs build artifacts verified"
      - name: Verify sitemap covers every route
        working-directory: docs-site
        run: |
          node -e "
            const fs = require('fs');
            const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
            const slugs = [...fs.readFileSync('src/main.tsx', 'utf8').matchAll(/\\{slug:'([^']+)'/g)].map(m => m[1]);
            const missing = slugs.filter(s => !sitemap.includes('axonweave/' + (s === 'index' ? '' : s)));
            if (missing.length) { console.error('sitemap missing:', missing); process.exit(1); }
            const dupes = slugs.filter((s, i) => slugs.indexOf(s) !== i);
            if (dupes.length) { console.error('duplicate slugs in registry:', dupes); process.exit(1); }
            console.log('sitemap covers ' + slugs.length + ' routes; no duplicates');
          "
      - name: Configure Pages (enables Pages if not yet enabled)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
