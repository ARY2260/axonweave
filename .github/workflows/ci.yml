name: CI
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10','3.11','3.12','3.13','3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ matrix.python }}}
      - run: python -m pip install -U pip
      - run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check python tests
      - name: Typecheck
        run: python -m mypy python/axonweave --ignore-missing-imports
        continue-on-error: true
      - name: Build sdist and wheel
        run: python -m build
      - name: Wheel smoke test
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import axonweave; print('wheel import ok:', axonweave.native_version())"

  backend-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {extra: [torch, tensorflow]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[${{ matrix.extra }}]" -e '.[dev]' --no-deps
      - run: python -m pip install pytest pytest-cov ruff
      - name: Run full test suite with backend installed
        run: python -m pytest -q
