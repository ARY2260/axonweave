[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "axonweave"
dynamic = ["version"]
description = "Trainable sparse biological neural substrates and composable connectome layers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AxonWeave Contributors"}]
keywords = ["connectome", "neuroscience", "neural-network", "pytorch", "tensorflow", "sparse", "biology"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyarrow>=14", "platformdirs>=4", "requests>=2.31", "pydantic>=2"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.15"]
neuprint = ["neuprint-python>=0.6.3"]
navis = ["navis>=1.10"]
jax = ["jax>=0.4.30"]
all = ["torch>=2.2", "tensorflow>=2.15", "jax>=0.4.30", "neuprint-python>=0.6.3", "navis>=1.10", "rich>=13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/dhakalnirajan/axonweave"
Documentation = "https://dhakalnirajan.github.io/axonweave/"
Repository = "https://github.com/dhakalnirajan/axonweave"
Issues = "https://github.com/dhakalnirajan/axonweave/issues"

[project.scripts]
axonweave = "axonweave.cli:main"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "python"
module-name = "axonweave._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]
# Version single source of truth: python/axonweave/__init__.py __version__.
# maturin parses it at build time and injects it into wheel metadata.

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
