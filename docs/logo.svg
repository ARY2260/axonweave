<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">AxonWeave logo</title><desc id="desc">A woven neural axon mark: two interlaced strands crossing through a central soma node, with branching synapse terminals. Dark tile, coral weave accent.</desc>
<rect width="256" height="256" rx="56" fill="#10151b"/>
<!-- weave strand A: light -->
<g fill="none" stroke="#d9e2ea" stroke-width="12" stroke-linecap="round">
<path d="M40 76 C88 76 104 128 128 128 C152 128 168 180 216 180"/>
<path d="M40 180 C88 180 104 128 128 128 C152 128 168 76 216 76"/>
</g>
<!-- weave strand B: coral accent, offset for over/under depth -->
<g fill="none" stroke="#ee4c2c" stroke-width="12" stroke-linecap="round" opacity="0.92">
<path d="M48 64 C96 72 112 132 160 176 C176 190 196 196 214 194"/>
<path d="M48 192 C96 184 112 124 160 80 C176 66 196 60 214 62"/>
</g>
<!-- soma node -->
<circle cx="128" cy="128" r="17" fill="#10151b" stroke="#d9e2ea" stroke-width="7"/>
<circle cx="128" cy="128" r="6" fill="#ee4c2c"/>
<!-- synapse terminals -->
<circle cx="40" cy="76" r="8" fill="#d9e2ea"/>
<circle cx="40" cy="180" r="8" fill="#d9e2ea"/>
<circle cx="216" cy="76" r="8" fill="#ee4c2c"/>
<circle cx="216" cy="180" r="8" fill="#ee4c2c"/>
</svg>
